[project]
name = "federated-learning-server"
version = "0.1.0"
description = "The server app of Federated Learning Service"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "setuptools>=80.9.0",
    "flwr>=1.25.0",
    "peft>=0.18.1",
    "federated-learning-common-library",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

#[tool.uv.sources]
#federated-learning-common-library = { path = "../federated-learning-common-library" }


[[tool.uv.index]]
name = "federated-learning-common-library"
url = "https://gitlab-core.supsi.ch/api/v4/projects/1641/packages/pypi/simple"


[build-system]
requires = ["setuptools>=65.5.1", "wheel", "build"]
build-backend = "setuptools.build_meta"
