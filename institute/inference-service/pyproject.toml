[project]
name = "inference-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "setuptools>=80.9.0",
    "pydantic-settings>=2.12.0",
    "fastapi>=0.127.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "torch==2.9.1",
    "transformers==4.57.2",
    "accelerate==1.12.0",
    "shared-auth-library",
    "bitsandbytes>=0.49.2",
    "peft>=0.18.1",
    "celery-types>=0.24.0",
    "celery[redis]>=5.6.2",
]

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
]
#shared-auth-library = { path = "../../shared-auth-library" }
shared-auth-library = { index = "gitlab" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "gitlab"
url = "https://gitlab-edu.supsi.ch/api/v4/projects/1401/packages/pypi/simple"
authenticate = "always"