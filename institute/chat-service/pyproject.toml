[project]
name = "chat-service"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "setuptools>=80.9.0",
    "pydantic-settings>=2.12.0",
    "fastapi>=0.127.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.21",
    "alembic>=1.17.2",
    "dotenv>=0.9.9",
    "requests>=2.32.5",
    "aiomysql>=0.3.2",
    "shared-auth-library",
    "httpx>=0.28.1",
    "sse-starlette>=3.2.0",
    "redis>=7.3.0",
    "greenlet>=3.3.1",
]

[tool.uv.sources]
shared-auth-library = { path = "../../shared-auth-library" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
#shared-auth-library = { index = "gitlab" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["--cov=src", "--cov-report=term-missing", "--cov-report=html:htmlcov", "--cov-fail-under=80", "--cov-branch", "-v"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]

#[[tool.uv.index]]
#name = "gitlab"
#url = "https://gitlab-edu.supsi.ch/api/v4/projects/1401/packages/pypi/simple"
#authenticate = "always"