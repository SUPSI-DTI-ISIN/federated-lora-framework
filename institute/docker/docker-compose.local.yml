services:
  redis-inference-service:
    image: redis:8.6.1
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    command: [ "redis-server" ]
    restart: always
    volumes:
      - redis-inference-data:/data

  documents-mysql-db:
    image: mysql:8.4.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCUMENTS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DOCUMENTS_MYSQL_DATABASE}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DOCUMENTS_MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - documents-mysql-data:/var/lib/mysql

  chats-mysql-db:
    image: mysql:8.4.7
    ports:
      - "33061:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CHATS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CHATS_MYSQL_DATABASE}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${CHATS_MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - chats-mysql-data:/var/lib/mysql

volumes:
  redis-inference-data:
    driver: local
  documents-mysql-data:
    driver: local
  chats-mysql-data:
    driver: local