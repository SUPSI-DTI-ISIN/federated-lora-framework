services:
  postgres:
    image: postgres:15
    container_name: mlflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 10
    volumes:
      - mlflow-postgres-data:/var/lib/postgresql/data
    networks:
      - internal-department

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mlflow-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"
    volumes:
      - mlflow-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - internal-department
      - external

  minio_mc:
    build:
      context: ../department/minio
      dockerfile: Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_SERVICE_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    networks:
      - internal-department

  mlflow:
    build:
      context: ../department/mlflow
      dockerfile: Dockerfile
    container_name: mlflow-server
    restart: always
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://flow-bucket
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal-department

  mlflow-service:
    build:
      context: ../department/mlflow-service
      dockerfile: docker/Dockerfile
      args:
        ENV_PATH: .env.local
    restart: always
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9010:9010"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9010/api_mlflow/health" ]
      interval: 20s
      timeout: 5s
      retries: 10
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - internal-department
      - external

  nginx-department-service:
    build:
      context: ../department/nginx-service
      dockerfile: docker/Dockerfile
    environment:
      MLFLOW_SERVICE_URL: http://mlflow-service:9010
      PORT: 81
    restart: always
    ports:
      - "81:81"
    depends_on:
      mlflow-service:
        condition: service_healthy
    networks:
      - internal-department
      - external

  mysql-db:
    image: mysql:8.4.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal-institute

  inference-service:
    build:
      context: ../institute/inference-service
      dockerfile: docker/Dockerfile
      args:
        ENV_PATH: .env.local
    environment:
      FRONTEND_URL: http://frontend:80
    restart: always
    ports:
      - "8095:8095"
    depends_on:
      model-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8095/api_inference/health" ]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - internal-institute

  data-service:
    build:
      context: ../data-service
      dockerfile: docker/Dockerfile
      args:
        ENV_PATH: .env.local
    environment:
      ALEMBIC_SYNC_DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-db:3306/${MYSQL_DATABASE}
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql-db:3306/${MYSQL_DATABASE}
      DB_HOST: mysql-db
      DB_PORT: 3306
      FRONTEND_URL: http://frontend:80
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api_data/health" ]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - internal-institute

  model-service:
    build:
      context: ../institute/model-service
      dockerfile: docker/Dockerfile
      args:
        ENV_PATH: .env.local
    environment:
      FRONTEND_URL: http://frontend:80
      DEPARTMENT_NGINX_SERVICE_URL: http://nginx-department-service:81
    restart: always
    ports:
      - "8090:8090"
    depends_on:
      nginx-department-service:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/api_model/health" ]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - internal-institute
      - external

  frontend:
    build:
      context: ../institute/frontend
      dockerfile: docker/Dockerfile
      args:
        NPM_TOKEN: ${GITLAB_TOKEN}
        ENV_PATH: .env.local
    environment:
      INFERENCE_SERVICE_URL: http://inference-service:8095
      DATA_SERVICE_URL: http://data-service:8080
      MODEL_SERVICE_URL: http://model-service:8090
      PORT: 80
    restart: always
    ports:
      - "80:80"
    depends_on:
      inference-service:
        condition: service_healthy
      data-service:
        condition: service_healthy
      model-service:
        condition: service_healthy
    networks:
      - internal-institute
      - external

volumes:
  mysql-data:
    driver: local
  mlflow-postgres-data:
    driver: local
  mlflow-minio-data:
    driver: local

networks:
  internal-department:
    driver: bridge
    internal: true
  internal-institute:
    driver: bridge
    internal: true
  external:
    driver: bridge
    internal: false