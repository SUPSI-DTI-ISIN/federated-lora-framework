[project]
name = "federated-learning-service"
version = "0.1.0"
description = "Federated Learning service which contains client app and server app to orchestrate FL fine tuning"
requires-python = "==3.12.12"
dependencies = [
    "datasets>=4.4.1",
    "flwr>=1.23.0",
    "peft>=0.18.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pymupdf>=1.26.6",
    "torch>=2.9.1",
]

[tool.flwr.app]
publisher = "luca.fanto"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "src.server_app:app"
clientapp = "src.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
model-name = "distilbert/distilgpt2"
pdf-folder = "pdf-innosuisse/"
num-server-rounds = 3
fraction-train = 0.5
local-epochs = 1
lr = 0.01

# Default federation to use when running the app
[tool.flwr.federations]
default = "local-simulation"

# Local simulation federation with 10 virtual SuperNodes
[tool.flwr.federations.local-simulation]
options.num-supernodes = 5

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true

# Remote federation example for use with SuperLink
[tool.flwr.federations.remote-federation]
address = "<SUPERLINK-ADDRESS>:<PORT>"
insecure = true  # Remove this line to enable TLS
# root-certificates = "<PATH/TO/ca.crt>"  # For TLS setup