[project]
name = "federated-learning-service"
version = "0.1.0"
description = "Federated Learning service which contains client app and server app to orchestrate FL fine tuning"
requires-python = ">=3.12.12"
dependencies = [
    "datasets>=4.4.2",
    "federated-learning-client",
    "federated-learning-server",
    "flwr[simulation]>=1.25.0",
    "peft>=0.18.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pymupdf>=1.26.7",
    "torch>=2.9.1",
]

[tool.flwr.app]
publisher = "luca.fanto"

[tool.flwr.app.components]
#serverapp = "server_app.server_app:app"
#clientapp = "client_app.client_app:app"
serverapp = "server_app_test:server_app_test"
clientapp = "client_app_test:client_app_test"


[tool.flwr.app.config]
model-name = "llama-2-7b"
device = "cpu"
data-service-url = "http://localhost:8080"
num-server-rounds = 3
fraction-train = 0.5
local-epochs = 1
lr = 0.01

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true

# Remote federation example for use with SuperLink
[tool.flwr.federations.remote-federation]
address = "<SUPERLINK-ADDRESS>:<PORT>"
insecure = true  # Remove this line to enable TLS

# root-certificates = "<PATH/TO/ca.crt>"  # For TLS setup


[tool.uv.sources]
federated-learning-server = { path = "../department/federated-learning-server" }
federated-learning-client = { path = "../institute/federated-learning-client" }

