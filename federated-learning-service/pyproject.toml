[project]
name = "federated-learning-service"
version = "0.1.0"
description = "Federated Learning service which contains client app and server app to orchestrate FL fine tuning"
requires-python = ">=3.12.12"
dependencies = [
    "bitsandbytes>=0.49.1",
    "datasets>=4.4.2",
    #"federated-learning-client",
    #"federated-learning-server",
    "flwr[simulation]>=1.25.0",
    "peft>=0.18.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "torch==2.9.1",
    "transformers==4.57.2",
    "accelerate==1.12.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.flwr.app]
publisher = "luca-fanto"

[tool.flwr.app.components]
serverapp = "src.server_app:app"
clientapp = "src.client_app:app"


[tool.flwr.app.config]
num-server-rounds = 1
fraction-train = 0.5
local-epochs = 1
lr = 0.01

[superlink]
default = "local-simulation"

[superlink.local-simulation]
options.num-supernodes = 2

[superlink.local-deployment]
address = "127.0.0.1:9093"
insecure = true

[superlink.nvidia-deployment]
address = "10.11.13.6:9093"
insecure = true

